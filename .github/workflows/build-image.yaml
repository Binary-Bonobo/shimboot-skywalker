name: build-image
run-name: Build custom self-generated dev-signed shim for skywalker only
on: [push, workflow_dispatch]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: Pussla ihop kernel och bygg egen Skywalker-shim
        run: |
          # 1. Pussla ihop dina två uppladdade bitar till den fullständiga 32MB kerneln
          cat skywalker_chunk_aa skywalker_chunk_ab > my_skywalker_kernel.kpart
          
          # 2. Installera beroenden
          sudo apt-get update || true
          sudo apt-get install -y \
            jq wget unzip curl zip pv parted debootstrap systemd-container \
            pcregrep cgpt vboot-kernel-utils vboot-utils qemu-user-static \
            binfmt-support arch-test dosfstools e2fsprogs apt-file binwalk \
            cpio lz4 git coreboot-utils flashrom mtd-utils
          
          sudo apt-file update || true

          # 3. Skapa arbetskataloger
          mkdir -p data/rootfs
          
          # 4. Bygg operativsystemets basfiler (Debian Bookworm ARM64)
          sudo ./build_rootfs.sh data/rootfs bookworm > /dev/null

          # 5. Dev-signera din dumpade kernel så att den accepteras av Depthcharge
          sudo vbutil_kernel \
            --pack data/signed_skywalker_kernel.kpart \
            --keyblock /usr/share/vboot/devkeys/kernel.keyblock \
            --signprivate /usr/share/vboot/devkeys/kernel_data_key.vbprivk \
            --version 1 \
            --vmlinuz my_skywalker_kernel.kpart \
            --bootloader /dev/null \
            --config /dev/null \
            --arch arm

          # 6. Låt Shimboots inbyggda byggverktyg baka ihop komponenterna till den färdiga avbildningen
          # Vi använder din dev-signerade kpart som bas direkt in i byggskriptet
          sudo ./patch_rootfs.sh data/signed_skywalker_kernel.kpart data/rootfs || true
          sudo ./build.sh data/shimboot_skywalker.bin data/signed_skywalker_kernel.kpart data/rootfs

          # Packa till en zip-fil för nedladdning
          cd data && zip -7 shimboot_skywalker.zip shimboot_skywalker.bin && cd ..

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_skywalker
          path: |
            data/shimboot_skywalker.bin
            data/shimboot_skywalker.zip
          compression-level: 7
