name: build-image
run-name: Build the shimboot disk image for skywalker only
on: [push, workflow_dispatch]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: Pussla ihop kernel och bygg för Skywalker
        run: |
          # Sätter ihop dina två uppladdade bitar till den fullständiga 32MB kerneln
          cat skywalker_chunk_aa skywalker_chunk_ab > my_skywalker_kernel.kpart
          
          # Installera de basverktyg som behövs för bygget i Ubuntu-miljön
          sudo apt-get update
          sudo apt-get install -y jq wget unzip curl zip debootstrap binwalk cpio vboot-utils cgpt
          
          # Skapa datamappen där filerna ska ligga
          mkdir -p data/rootfs
          
          # Hämta en fungerande MediaTek-shim som hårdvarubas (jacuzzi matchar MT8183/8189-arkitekturen bäst)
          wget -q https://cros.download -O data/fallback_shim.zip
          unzip -o data/fallback_shim.zip -d data/
          FALLBACK_BIN=$(find data/ -name "*.bin" ! -name "reco_*" | head -n 1)
          
          # Kör Shimboots egna byggskript med din lokala Skywalker-kernel
          sudo ./build_rootfs.sh data/rootfs bookworm
          sudo ./patch_rootfs.sh "$FALLBACK_BIN" my_skywalker_kernel.kpart data/rootfs
          sudo ./build.sh data/shimboot_skywalker.bin "$FALLBACK_BIN" data/rootfs
          
          # Packa till en zip-fil för eventuella releases
          cd data && zip -7 shimboot_skywalker.zip shimboot_skywalker.bin && cd ..

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_skywalker
          path: |
            data/shimboot_skywalker.bin
            data/shimboot_skywalker.zip
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            data/shimboot_skywalker.zip
            data/shimboot_skywalker.bin
