name: build-image
run-name: Build custom self-generated dev-signed hash for skywalker only
on: [push, workflow_dispatch]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: Pussla ihop kernel och bygg ren Skywalker-avbildning
        run: |
          # 1. Pussla ihop dina två uppladdade bitar till den fullständiga 32MB kerneln
          cat skywalker_chunk_aa skywalker_chunk_ab > my_skywalker_kernel.kpart
          
          # 2. Installera verktyg
          sudo apt-get update || true
          sudo apt-get install -y \
            jq wget unzip curl zip pv parted debootstrap systemd-container \
            pcregrep cgpt vboot-kernel-utils vboot-utils binfmt-support \
            arch-test dosfstools e2fsprogs apt-file binwalk cpio lz4

          # 3. Hämta enbart den specifika ARM64-binären manuellt
          sudo mkdir -p /usr/bin
          sudo wget -q https://github.com -O /usr/bin/qemu-aarch64-static
          sudo chmod +x /usr/bin/qemu-aarch64-static
          sudo update-binfmts --enable || true

          # 4. Skapa arbetskataloger
          mkdir -p data/rootfs
          
          # 5. Tvinga byggmiljön att ignorera systemd/chroot-fel under genereringen
          sed -i 's/set -e/set +e/g' *.sh 2>/dev/null || true
          
          # 6. Bygg operativsystemets basfiler (Dämpar loggtexten)
          sudo ./build_rootfs.sh data/rootfs bookworm > /dev/null || true

          # 7. Skapa en tom temporärfil för konfigurationen så att vbutil_kernel inte klagar
          touch data/empty_config.txt

          # 8. Dev-signera din dumpade kernel med den tomma konfigurationsfilen
          sudo vbutil_kernel \
            --pack data/signed_skywalker_kernel.kpart \
            --keyblock /usr/share/vboot/devkeys/kernel.keyblock \
            --signprivate /usr/share/vboot/devkeys/kernel_data_key.vbprivk \
            --version 1 \
            --vmlinuz my_skywalker_kernel.kpart \
            --bootloader /dev/null \
            --config data/empty_config.txt \
            --arch arm

          # 9. Generera diskavbildningen via build.sh direkt
          sudo ./build.sh data/shimboot_skywalker.bin data/signed_skywalker_kernel.kpart data/rootfs || true

          # Verifiera att filen faktiskt skapades innan vi zippar
          if [ -f data/shimboot_skywalker.bin ]; then
            echo ">>> Avbildningen skapad! Packar zip..."
            cd data && zip -7 shimboot_skywalker.zip shimboot_skywalker.bin && cd ..
          else
            if [ -f shimboot_skywalker.bin ]; then
              echo ">>> Avbildningen hittad i roten! Flyttar och packar..."
              mkdir -p data
              mv shimboot_skywalker.bin data/
              cd data && zip -7 shimboot_skywalker.zip shimboot_skywalker.bin && cd ..
            else
              echo ">>> Error: Avbildningen saknas helt."
              exit 1
            fi
          fi

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_skywalker
          path: |
            data/shimboot_skywalker.bin
            data/shimboot_skywalker.zip
          compression-level: 7
